<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7cac">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tugas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Pencatat PR & Tugas</title>
<style>
:root{
  --bg:#eef3f2; --card:#ffffff; --ink:#22343a; --muted:#6b8087; --line:#dbe5e4;
  --accent:#4f7cac; --accent-soft:#e3edf7; --ok:#4c9a7a; --ok-soft:#e1f2ea;
  --warn:#c98a2b; --warn-soft:#fbf0dc; --bad:#c9524f; --bad-soft:#fae4e3;
  --shadow:0 6px 24px rgba(34,52,58,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#172125; --card:#1f2c31; --ink:#e3eeee; --muted:#93a8ad; --line:#2f4147;
    --accent:#7fa9d6; --accent-soft:#25384a; --ok:#6cbf9d; --ok-soft:#1f3a30;
    --warn:#e0aa55; --warn-soft:#3a3120; --bad:#e17d7a; --bad-soft:#3d2626;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  line-height:1.5; min-height:100vh;
}
.wrap{max-width:720px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom))}
header{margin-bottom:22px}
h1{font-size:1.75rem; margin:0 0 4px; letter-spacing:-.01em}
.sub{color:var(--muted); margin:0}
.stats{display:flex; gap:10px; margin:18px 0 0; flex-wrap:wrap}
.stat{flex:1 1 90px; background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow)}
.stat b{display:block; font-size:1.4rem; line-height:1.2}
.stat span{font-size:.82rem; color:var(--muted)}
.stat.late b{color:var(--bad)}

.card{background:var(--card); border-radius:18px; padding:20px; box-shadow:var(--shadow)}
form{display:grid; gap:14px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
label{display:block; font-size:.86rem; font-weight:700; margin-bottom:5px}
input,select,button{font:inherit; color:inherit}
input[type=text],input[type=date]{
  width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:11px;
  background:var(--bg); outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  background:var(--accent); color:#fff; border:0; border-radius:11px; padding:12px 18px;
  font-weight:700; cursor:pointer; transition:filter .15s, transform .1s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tab:focus-visible,.del:focus-visible,.link:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px}
.err{color:var(--bad); font-size:.85rem; min-height:1.2em; margin:-6px 0 0}

.bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:26px 0 12px; flex-wrap:wrap}
.tabs{display:inline-flex; background:var(--card); border-radius:12px; padding:4px; box-shadow:var(--shadow)}
.tab{border:0; background:transparent; padding:8px 16px; border-radius:9px; cursor:pointer; font-weight:700; color:var(--muted)}
.tab[aria-selected=true]{background:var(--accent); color:#fff}
.link{background:none; border:0; color:var(--muted); cursor:pointer; text-decoration:underline; font-size:.88rem}
.link:hover{color:var(--bad)}

ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.task{
  display:flex; gap:12px; align-items:flex-start; background:var(--card);
  border-radius:14px; padding:14px 14px 14px 16px; box-shadow:var(--shadow);
  border-left:5px solid var(--accent);
}
.task.late{border-left-color:var(--bad)}
.task.today{border-left-color:var(--warn)}
.task.done{border-left-color:var(--ok); opacity:.85}
.chk{width:22px; height:22px; margin-top:2px; accent-color:var(--ok); cursor:pointer; flex:none}
.body{flex:1; min-width:0}
.title{font-weight:700; overflow-wrap:anywhere}
.done .title{text-decoration:line-through; color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:6px; align-items:center; font-size:.82rem; color:var(--muted)}
.chip{padding:2px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent); font-weight:700}
.badge{padding:2px 9px; border-radius:99px; font-weight:700}
.b-late{background:var(--bad-soft); color:var(--bad)}
.b-today{background:var(--warn-soft); color:var(--warn)}
.b-soon{background:var(--warn-soft); color:var(--warn)}
.b-ok{background:var(--ok-soft); color:var(--ok)}
.del{
  border:0; background:transparent; color:var(--muted); cursor:pointer; border-radius:9px;
  width:36px; height:36px; font-size:1.1rem; flex:none;
}
.del:hover{background:var(--bad-soft); color:var(--bad)}
.empty{text-align:center; color:var(--muted); padding:34px 16px; background:var(--card); border-radius:14px; box-shadow:var(--shadow)}
.empty b{display:block; color:var(--ink); margin-bottom:2px}
@media (max-width:480px){
  .row{grid-template-columns:1fr}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pencatat PR &amp; Tugas</h1>
    <p class="sub">Semua tugas tersimpan otomatis di browser ini sampai kamu menyelesaikannya.</p>
    <div class="stats">
      <div class="stat"><b id="sActive">0</b><span>Tugas aktif</span></div>
      <div class="stat late"><b id="sLate">0</b><span>Terlambat</span></div>
      <div class="stat"><b id="sDone">0</b><span>Selesai</span></div>
    </div>
  </header>

  <section class="card">
    <form id="form" novalidate>
      <div>
        <label for="name">Nama tugas / PR</label>
        <input type="text" id="name" maxlength="120" placeholder="Contoh: Latihan soal bab 4" autocomplete="off">
      </div>
      <div class="row">
        <div>
          <label for="subject">Mata pelajaran / mata kuliah</label>
          <input type="text" id="subject" list="subjects" maxlength="40" placeholder="Pilih atau ketik sendiri" autocomplete="off">
          <datalist id="subjects">
            <option>Matematika</option><option>Bahasa Indonesia</option><option>Bahasa Inggris</option>
            <option>Fisika</option><option>Kimia</option><option>Biologi</option>
            <option>Sejarah</option><option>Geografi</option><option>Ekonomi</option>
            <option>Sosiologi</option><option>Informatika</option><option>Seni Budaya</option>
          </datalist>
        </div>
        <div>
          <label for="due">Tenggat waktu</label>
          <input type="date" id="due">
        </div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">Tambah tugas</button>
    </form>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabActive" aria-selected="true">Tugas Aktif</button>
      <button class="tab" role="tab" id="tabDone" aria-selected="false">Tugas Selesai</button>
    </div>
    <button class="link" id="clearDone" hidden>Hapus semua riwayat</button>
  </div>

  <ul id="list"></ul>
</div>

<script>
(function(){
  var KEY = 'pencatat-pr-v1';
  var tasks = [];
  var view = 'active';

  var $ = function(id){ return document.getElementById(id); };
  var list = $('list'), form = $('form'), err = $('err');

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      tasks = Array.isArray(data) ? data : [];
    } catch(e){ tasks = []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); }
    catch(e){ err.textContent = 'Penyimpanan browser tidak tersedia, tugas tidak akan tersimpan.'; }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function daysLeft(due){
    var a = new Date(due+'T00:00:00'), b = new Date(todayStr()+'T00:00:00');
    return Math.round((a-b)/86400000);
  }
  function fmtDate(due){
    return new Date(due+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  }
  function status(t){
    if (t.done) return {cls:'done', badge:''};
    var d = daysLeft(t.due);
    if (d < 0)  return {cls:'late',  badge:'<span class="badge b-late">Terlambat '+Math.abs(d)+' hari</span>'};
    if (d === 0) return {cls:'today', badge:'<span class="badge b-today">Hari ini!</span>'};
    if (d === 1) return {cls:'',      badge:'<span class="badge b-soon">Besok</span>'};
    if (d <= 3)  return {cls:'',      badge:'<span class="badge b-soon">'+d+' hari lagi</span>'};
    return {cls:'', badge:'<span class="badge b-ok">'+d+' hari lagi</span>'};
  }

  function render(){
    var active = tasks.filter(function(t){ return !t.done; });
    var done = tasks.filter(function(t){ return t.done; });
    $('sActive').textContent = active.length;
    $('sDone').textContent = done.length;
    $('sLate').textContent = active.filter(function(t){ return daysLeft(t.due) < 0; }).length;

    var shown = view === 'active'
      ? active.sort(function(a,b){ return a.due.localeCompare(b.due); })
      : done.sort(function(a,b){ return (b.doneAt||0) - (a.doneAt||0); });

    $('clearDone').hidden = !(view === 'done' && done.length);

    if (!shown.length){
      list.innerHTML = view === 'active'
        ? '<li class="empty"><b>Tidak ada tugas aktif</b>Tambahkan PR atau tugas baru lewat formulir di atas.</li>'
        : '<li class="empty"><b>Belum ada tugas selesai</b>Tugas yang kamu centang akan muncul di sini.</li>';
      return;
    }
    list.innerHTML = shown.map(function(t){
      var s = status(t);
      return '<li class="task '+s.cls+'" data-id="'+t.id+'">'+
        '<input class="chk" type="checkbox" aria-label="Tandai selesai: '+esc(t.name)+'"'+(t.done?' checked':'')+'>'+
        '<div class="body"><div class="title">'+esc(t.name)+'</div>'+
        '<div class="meta"><span class="chip">'+esc(t.subject||'Umum')+'</span>'+
        '<span>Tenggat: '+fmtDate(t.due)+'</span>'+s.badge+'</div></div>'+
        '<button class="del" aria-label="Hapus tugas: '+esc(t.name)+'" title="Hapus">&#10005;</button></li>';
    }).join('');
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('name').value.trim(), subject = $('subject').value.trim(), due = $('due').value;
    if (!name){ err.textContent = 'Isi nama tugas terlebih dahulu.'; $('name').focus(); return; }
    if (!due){ err.textContent = 'Pilih tanggal tenggat.'; $('due').focus(); return; }
    err.textContent = '';
    tasks.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:name, subject:subject, due:due, done:false});
    save();
    $('name').value = ''; $('subject').value = '';
    view = 'active'; syncTabs(); render();
    $('name').focus();
  });

  list.addEventListener('click', function(e){
    var li = e.target.closest('li.task'); if (!li) return;
    var id = li.getAttribute('data-id');
    if (e.target.classList.contains('del')){
      if (!confirm('Hapus tugas ini?')) return;
      tasks = tasks.filter(function(t){ return t.id !== id; });
      save(); render();
    }
  });
  list.addEventListener('change', function(e){
    if (!e.target.classList.contains('chk')) return;
    var id = e.target.closest('li.task').getAttribute('data-id');
    tasks.forEach(function(t){
      if (t.id === id){ t.done = e.target.checked; t.doneAt = t.done ? Date.now() : null; }
    });
    save(); render();
  });

  function syncTabs(){
    $('tabActive').setAttribute('aria-selected', view === 'active');
    $('tabDone').setAttribute('aria-selected', view === 'done');
  }
  $('tabActive').onclick = function(){ view = 'active'; syncTabs(); render(); };
  $('tabDone').onclick = function(){ view = 'done'; syncTabs(); render(); };
  $('clearDone').onclick = function(){
    if (!confirm('Hapus semua tugas di riwayat?')) return;
    tasks = tasks.filter(function(t){ return !t.done; });
    save(); render();
  };

  $('due').min = '';
  $('due').value = todayStr();
  load(); render();
  // Perbarui penanda tenggat saat tab kembali dibuka
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) render(); });
})();
if ('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
